<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>求人票エージェント</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1f2328; --muted: #6a737d;
    --border: #e1e4e8; --accent: #2f6feb; --user: #e8f0fe; --error: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --text: #e6e6e6; --muted: #9aa4b2;
      --border: #2a2f3a; --accent: #6aa1ff; --user: #1e2a44; --error: #ff7b72;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .app { display: grid; grid-template-columns: 260px 1fr; height: 100dvh; }
  aside { border-right: 1px solid var(--border); background: var(--panel);
          display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 12px; border-bottom: 1px solid var(--border); }
  #me { font-size: 12px; color: var(--muted); margin-top: 6px; word-break: break-all; }
  #sessions { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
  #sessions li { display: flex; align-items: center; gap: 4px; border-radius: 6px; }
  #sessions li.active { background: var(--user); }
  #sessions li button.open { flex: 1; text-align: left; background: none; border: 0;
          color: var(--text); padding: 8px; cursor: pointer; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; font: inherit; }
  #sessions li button.del { background: none; border: 0; color: var(--muted); cursor: pointer; }
  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex;
              flex-direction: column; gap: 12px; }
  .msg { max-width: 820px; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap;
         word-break: break-word; border: 1px solid var(--border); background: var(--panel); }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg .att { font-size: 12px; color: var(--muted); }
  .msg.status { align-self: center; font-size: 12px; color: var(--muted);
                border: 0; background: none; padding: 0; }
  .msg.error { color: var(--error); }
  .empty { margin: auto; color: var(--muted); text-align: center; }
  form { border-top: 1px solid var(--border); background: var(--panel); padding: 10px;
         display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: vertical; min-height: 44px; max-height: 40vh; padding: 10px;
             border-radius: 8px; border: 1px solid var(--border); background: var(--bg);
             color: var(--text); font: inherit; }
  button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
                   padding: 10px 16px; cursor: pointer; font: inherit; }
  button.primary:disabled { opacity: .5; cursor: default; }
  label.file { cursor: pointer; color: var(--muted); padding: 10px 4px; font-size: 13px; }
  label.file input { display: none; }
  #file-name { font-size: 12px; color: var(--muted); max-width: 160px; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  .msg.agent { white-space: normal; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: 1em 0 .4em; line-height: 1.35; }
  .md h1 { font-size: 1.3em; } .md h2 { font-size: 1.2em; }
  .md h3 { font-size: 1.08em; } .md h4 { font-size: 1em; }
  .md p { margin: .5em 0; }
  .md ul, .md ol { margin: .4em 0; padding-left: 1.5em; }
  .md li { margin: .15em 0; }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 1em 0; }
  .md code { font: .9em ui-monospace, SFMono-Regular, Menlo, monospace;
             background: var(--bg); padding: .1em .3em; border-radius: 4px; }
  .md pre { background: var(--bg); padding: 10px; border-radius: 6px; overflow-x: auto; }
  .md pre code { padding: 0; background: none; }
  .md blockquote { margin: .5em 0; padding-left: 10px; border-left: 3px solid var(--border);
                   color: var(--muted); }
  .md table { border-collapse: collapse; margin: .5em 0; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .md a { color: var(--accent); }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); max-height: 30dvh; }
  }
</style>
<!-- Markdown の変換（marked）と、変換後の HTML の無害化（DOMPurify）。
     integrity で中身を固定し、CDN 上のファイルが書き換えられたら読み込まない -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha512-xeUh+KxNyTufZOje++oQHstlMQ8/rpyzPuM+gjMFYK3z5ILJGE7l2NvYL+XfliKURMpBIKKp1XoPN/qswlSMFA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha512-jB0TkTBeQC9ZSkBqDhdmfTv1qdfbWpGE72yJ/01Srq6hEzZIz2xkz1e57p9ai7IeHMwEG7HpzG6NdptChif5Pg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <button class="primary" id="new">＋ 新しい会話</button>
      <div id="me"></div>
    </header>
    <ul id="sessions"></ul>
  </aside>
  <main>
    <div id="messages"><div class="empty">求人ID、URL、本文の貼り付け、または PDF の添付で始めます。<br>
      例：「求人ID J-001 をまとめて、デフォルトの観点でネクストアクションを出して」</div></div>
    <form id="form">
      <label class="file" title="PDF を添付">📎<input type="file" id="file" accept="application/pdf"></label>
      <span id="file-name"></span>
      <textarea id="text" placeholder="メッセージ（Enter で改行、Ctrl+Enter / ⌘+Enter で送信）"></textarea>
      <button class="primary" id="send" type="submit">送信</button>
    </form>
  </main>
</div>
<script>
// 利用者の入力やエラーは textContent で入れ、HTML として解釈させない。
// エージェントの返答だけは Markdown を HTML に変換し、DOMPurify で無害化してから入れる
// （返答には求人ページや PDF の文章が含まれうるので、無害化は必須）。
const $ = (id) => document.getElementById(id);
const canRenderMarkdown = typeof marked !== "undefined" && typeof DOMPurify !== "undefined";
if (canRenderMarkdown) {
  marked.setOptions({ gfm: true, breaks: true });
  DOMPurify.addHook("afterSanitizeAttributes", (node) => {
    if (node.tagName === "A") {
      node.setAttribute("target", "_blank");
      node.setAttribute("rel", "noopener noreferrer");
    }
  });
}
const raw = new WeakMap();

function renderAgent(el, text) {
  raw.set(el, text);
  if (!canRenderMarkdown) { el.textContent = text; return; }
  el.innerHTML = DOMPurify.sanitize(marked.parse(text), {
    FORBID_TAGS: ["style", "form", "input", "button", "textarea", "select", "img"],
    FORBID_ATTR: ["style"],
  });
}
const api = (path, opts = {}) => fetch(path, {
  ...opts, headers: { "X-Requested-With": "fetch", ...(opts.headers || {}) },
});
let current = null;

function addMessage(role, text, attachments = []) {
  const box = $("messages");
  box.querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  for (const a of attachments) {
    const att = document.createElement("div");
    att.className = "att";
    att.textContent = "📎 " + a;
    el.appendChild(att);
  }
  const body = document.createElement(role === "agent" ? "div" : "span");
  if (role === "agent") {
    body.className = "md";
    renderAgent(body, text);
  } else {
    body.textContent = text;
  }
  el.appendChild(body);
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
  return body;
}

async function errorText(res) {
  try { return (await res.json()).detail || res.statusText; } catch { return res.statusText; }
}

async function loadSessions() {
  const res = await api("/api/sessions");
  if (!res.ok) return;
  const list = $("sessions");
  list.replaceChildren();
  for (const s of await res.json()) {
    const li = document.createElement("li");
    if (s.id === current) li.className = "active";
    const open = document.createElement("button");
    open.className = "open";
    open.textContent = s.title;
    open.onclick = () => openSession(s.id);
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "×";
    del.title = "削除";
    del.onclick = async () => {
      if (!confirm("この会話を削除しますか？元に戻せません。")) return;
      await api("/api/sessions/" + encodeURIComponent(s.id), { method: "DELETE" });
      if (current === s.id) { current = null; $("messages").replaceChildren(); }
      loadSessions();
    };
    li.append(open, del);
    list.appendChild(li);
  }
}

async function openSession(id) {
  const res = await api("/api/sessions/" + encodeURIComponent(id));
  if (!res.ok) return;
  current = id;
  $("messages").replaceChildren();
  for (const m of (await res.json()).messages) addMessage(m.role, m.text, m.attachments);
  loadSessions();
}

async function ensureSession() {
  if (current) return current;
  const res = await api("/api/sessions", { method: "POST" });
  if (!res.ok) throw new Error(await errorText(res));
  current = (await res.json()).id;
  return current;
}

async function send(e) {
  e?.preventDefault();
  const text = $("text").value.trim();
  const file = $("file").files[0];
  if (!text && !file) return;
  $("send").disabled = true;
  try {
    const id = await ensureSession();
    const form = new FormData();
    form.append("text", text);
    if (file) form.append("file", file);
    addMessage("user", text, file ? [file.name] : []);
    $("text").value = ""; $("file").value = ""; $("file-name").textContent = "";

    const res = await api("/api/sessions/" + encodeURIComponent(id) + "/messages",
                          { method: "POST", body: form });
    if (!res.ok) { addMessage("status error", await errorText(res)); return; }

    let body = null;
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === "delta") {
          body = body || addMessage("agent", "");
          renderAgent(body, (raw.get(body) || "") + ev.text);
          $("messages").scrollTop = $("messages").scrollHeight;
        } else if (ev.type === "tool") {
          addMessage("status", "🔧 " + ev.name);
          body = null;
        } else if (ev.type === "error") {
          addMessage("status error", ev.message);
        }
      }
    }
  } catch (err) {
    addMessage("status error", String(err.message || err));
  } finally {
    $("send").disabled = false;
    loadSessions();
  }
}

$("form").addEventListener("submit", send);
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send(e);
});
$("file").addEventListener("change", () => {
  $("file-name").textContent = $("file").files[0]?.name || "";
});
$("new").onclick = () => {
  current = null;
  $("messages").replaceChildren();
  loadSessions();
  $("text").focus();
};
if (!location.protocol.startsWith("http")) {
  // ファイルとして直接開くと API を呼べないので、開き方を案内する
  const box = $("messages");
  box.replaceChildren();
  addMessage("status error",
    "この画面はサーバー経由で開いてください。\n" +
    "uv run uvicorn --factory job_posting_agent.server:create_app --reload\n" +
    "を実行して、http://localhost:8000 を開きます。");
  $("send").disabled = true;
  $("new").disabled = true;
} else {
  api("/api/me").then(async (r) => { if (r.ok) $("me").textContent = (await r.json()).user; });
  loadSessions();
}
</script>
</body>
</html>
